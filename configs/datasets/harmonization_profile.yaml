    name: bridge_v1_8fps_160
    target_fps: 8
    target_width: 160
    target_height: 160
    video_codec: libx264
    pix_fmt: yuv420p
    preset: veryfast
    crf: 28
    keep_audio: false
    resize_mode: pad
    scale_flags: lanczos
